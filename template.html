<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Mist Grove</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content=#061d24>
<style>
html { background: #061d24; }
body {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; margin: 0; overflow: hidden;
  background: radial-gradient(#12444f, #061d24 72%);
  font: 700 clamp(13px, .7vw + .9vh, 36px)/1.4 system-ui, sans-serif; color: #eefaf8;
  -webkit-user-select: none; user-select: none;
}
@media (orientation: portrait) and (pointer: coarse) {
  body { width: 100dvh; height: 100dvw; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
}
canvas {
  position: absolute; width: 100%; height: 100%; touch-action: none; cursor: crosshair;
  transition: filter 1s, transform 1s, opacity 1.5s;
}
body:not(.g) canvas { filter: blur(1vmax) brightness(.55); transform: scale(1.05); }
.l canvas { opacity: 0; }
#m {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: min(2em, 5.5vmin);
  padding: 1em 1em 3em; text-align: center; background: radial-gradient(#061d2400 28%, #061d24d4);
  transition: opacity .5s, visibility .5s;
}
.g #m, .m #l, .l #g { opacity: 0; visibility: hidden; }
h1 {
  margin: 0; font: 900 4.2em/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase;
  color: #0000; background: linear-gradient(#fff6e5 18%, #f7ca7e 56%, #7be3d8);
  -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 .06em .22em #000c);
}
p { margin: 0; }
#a { display: grid; width: 32em; max-width: 100%; }
#a > * { grid-area: 1/1; transition: opacity .7s, visibility .7s; }
#s, #w, #q, #k, #h { font-size: .78em; letter-spacing: .11em; text-transform: uppercase; }
#w { margin-top: 1.1em; color: #8cf2e4; text-wrap: balance; }
#p {
  height: .5em; margin: .4em 0 1em; overflow: hidden; border-radius: 1em; background: #061d24;
  box-shadow: 0 0 0 2px #f7ca7e80, 0 0 1.4em #52c7b888;
}
#b {
  display: block; height: 100%; background: linear-gradient(90deg, #52c7b8, #ffe0a3);
  transform: scaleX(0); transform-origin: 0; will-change: transform;
}
.e #p { visibility: hidden; }
.e #s { font-size: 1.05em; letter-spacing: 0; text-transform: none; }
button {
  display: flex; align-items: center; justify-content: center; gap: .6em; padding: .75em 1.3em; border: 0;
  border-radius: .5em; background: #fff; box-shadow: inset 0 -.2em #0003, 0 .3em 1em #0008;
  font: 800 1em/1.2 system-ui, sans-serif; letter-spacing: .11em; text-transform: uppercase;
  color: #09262d; cursor: pointer; transition: transform .12s, filter .12s;
}
button:hover { transform: translateY(-.1em); filter: brightness(1.1); }
button:active { transform: translateY(.08em); filter: brightness(.92); }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#g { display: grid; gap: min(1.1em, 3vmin); }
#d {
  padding: .85em; background: linear-gradient(#ffe3a8, #e6a952); font-size: 1.25em; color: #1f1407;
  box-shadow: inset 0 -.2em #0003, 0 0 2em #f2b75eb0;
}
#q, #k, #h { padding: .95em 1.4em; border-radius: .7em; background: #061d24bf; }
#q { display: flex; align-items: center; gap: .35em; padding: .4em; flex-wrap: wrap; }
#q span { flex: 1; color: #8cf2e4; min-width: 4.5em; }
#q button { flex: 1; padding: .65em .4em; background: none; box-shadow: none; color: #eefaf8; }
#q button:hover { background: #7be3d82b; }
#q .on { background: linear-gradient(#9ef7ea, #2ab5a5); box-shadow: inset 0 -.2em #0003; color: #062126; pointer-events: none; }
#k { display: flex; justify-content: center; gap: 1.8em; text-align: left; }
#k p { display: grid; grid-template-columns: auto auto; align-content: start; align-items: center; gap: .5em .85em; }
#k p + p { padding-left: 1.8em; border-left: 2px solid #7be3d840; }
#k i { display: flex; justify-self: end; align-items: center; gap: .25em; font-style: normal; }
#k b {
  min-width: 1.1em; padding: .18em .48em; border-radius: .35em; background: #eefaf8;
  box-shadow: inset 0 -.15em #0004; color: #062126; text-align: center;
}
#h { display: none; }
@media (pointer: coarse), (max-height: 30em) { #k { display: none; } }
@media (pointer: coarse) { #h { display: block; } }
#o {
  position: absolute; top: .6em; right: .6em; display: none; padding: .3em .6em; background: #061d24d9;
  box-shadow: inset 0 0 0 2px #7be3d8, 0 .3em 1em #0008; font-size: 1.25em; color: #eefaf8; opacity: .82;
}
.g #o { display: flex; }
.p #o { display: none; }
#i {
  position: absolute; top: 1em; left: 1.2em; margin: 0; font: .8em/1.6 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; text-shadow: 0 1px 4px #000; pointer-events: none;
}
</style>
</head>
<body class=l>
<canvas id=c></canvas>
<div id=m>
  <h1>Mist Grove</h1>
  <div id=a>
    <div id=l><div id=p><i id=b></i></div><p id=s>Awakening the forest…</p><p id=w hidden>Use Google Chrome or Edge for WebGPU</p></div>
    <div id=g>
      <button id=d>Enter the Grove</button>
      <p id=q><span>Detail</span><button>Low</button><button>Medium</button><button>High</button><span style="flex:.8">Mode</span><button id=mw class=on>Walk</button><button id=mf>Fly</button></p>
      <div id=k>
        <p>
          <i><b>W</b><b>A</b><b>S</b><b>D</b></i>Move
          <i><b>Space</b></i>Jump / Up
          <i><b>Q</b><b>E</b></i>Fly Down / Up
          <i><b>Shift</b></i>Sprint
          <i><b>G</b></i>Walk / Fly
        </p>
        <p>
          <i><b>1</b>–<b>6</b></i>Viewpoints
          <i><b>F</b></i>60s Tour
          <i><b>Esc</b></i>Menu
          <i><b>M</b></i>Mute
          <i><b>H</b></i>Stats
        </p>
      </div>
      <p id=h>Hold to walk forward · slide to look · second finger to move faster</p>
    </div>
  </div>
</div>
<button id=o aria-label=Menu>≡</button>
<pre id=i></pre>
<script>
/*SCRIPT*/
</script>
</body>
</html>
